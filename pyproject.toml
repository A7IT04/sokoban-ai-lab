[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "sokoban-ai-lab"
version = "0.3.0"
description = "A reproducible Sokoban search and reinforcement learning playground"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
[project.optional-dependencies]
rl = ["gymnasium>=0.29.1,<1.3", "stable-baselines3>=2.4,<3", "sb3-contrib>=2.4,<3", "tensorboard>=2.15", "numpy>=1.24"]

[project.scripts]
sokoban-lab = "sokoban_lab.__main__:main"
sokoban-lab-train = "sokoban_lab.train:main"
[tool.setuptools.packages.find]
include = ["sokoban_lab*"]
