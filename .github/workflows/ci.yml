name: tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  rl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[rl]'
      - run: python -m unittest discover -s tests -v
      - run: python -m sokoban_lab.train --steps 128 --algorithm ppo --output runs/ppo
      - run: python -m sokoban_lab.train --steps 128 --algorithm rppo --output runs/rppo
      - run: python -m sokoban_lab.train --steps 1024 --algorithm dqn --output runs/dqn
